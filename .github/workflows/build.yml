name: Build plugin

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Budowanie Rozgi
        run: mvn -B clean package

      - name: Udostepnienie pluginu
        uses: actions/upload-artifact@v4
        with:
          name: Rozga-plugin
          path: target/Rozga-1.0.0.jar
          if-no-files-found: error
